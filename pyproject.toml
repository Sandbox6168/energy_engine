[project]
name = "energy-engine"
version = "0.1.0"
description = "Core engine that prices energy usage against UK electricity tariffs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components/energy_engine"]

[tool.ruff]
line-length = 100
src = ["custom_components/energy_engine", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
